<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Member profile</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#213a38;font:14px/1.45 "Segoe UI",system-ui,sans-serif}
article{border:1px solid #cbd9d5;border-radius:17px;overflow:hidden;background:#fff}
header{background:linear-gradient(120deg,#143f3c,#25615a);color:white;padding:18px;border-top:3px solid #d3aa62}
.kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#c4dcd5;margin:0 0 16px}
.identity{display:flex;align-items:center;gap:12px}.avatar{position:relative;flex:none;width:55px;height:55px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff1cb,#cda762);color:#513d21;font:600 24px Georgia,serif;border:2px solid #ffffffa0;overflow:hidden}
.avatar img{position:absolute;width:100%;height:100%;object-fit:cover}.avatar img[hidden]{display:none}
h2{margin:0;font:600 clamp(20px,8vw,28px)/1.12 Georgia,serif;overflow-wrap:anywhere}.id{font-size:12px;color:#cee4de;margin-top:4px}.place{margin:12px 0 0;color:#eef6f2;font-size:13px}
main{padding:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{border-radius:9px;padding:9px;background:#edf5f2}.stat+ .stat{background:#f5f2ea}.value{display:block;font-size:24px;font-weight:650;line-height:1.2}.value.long{font-size:15px}.label{font-size:11px;display:block;margin-top:4px}
section{margin-top:17px}h3{font-size:14px;margin:0 0 6px}.bio{margin:0;font-size:13px}.muted{color:#687872}
#chips{display:flex;flex-wrap:wrap;gap:5px;max-height:114px;overflow-y:auto;padding:3px 2px}
button{font:inherit}#chips button{border:1px solid #c7dbd4;border-radius:20px;background:#f2f7f5;color:#214c43;padding:4px 10px;cursor:pointer;font-size:12px}#chips button:hover{background:#dceee6}button:focus-visible{outline:2px solid #ae6c13;outline-offset:1px}
footer{border-top:1px solid #dce4df;padding-top:10px;margin-top:14px;font-size:11px;color:#65736f}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.actions button,.actions span{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:6px;padding:5px 8px}
.actions button{background:#f2f4f2;color:#5f6d67;border:1px solid #d1d9d5}
.actions svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#connected{color:#305d50;background:#edf5f2;font-weight:600}
footer [hidden]{display:none}
#comingSoon{margin:7px 0 10px}
#browser{margin:8px 0 0;padding:12px;border:1px solid #cbd9d5;border-radius:14px;background:#f8fbfa}
#browser h3{font-size:15px;color:#214c43;margin:0 0 8px}
#browser input,#browser select{width:100%;font:inherit;border:1px solid #bfd1ca;border-radius:6px;background:white;color:#213a38;padding:5px}
#tools{display:grid;grid-template-columns:1fr auto;gap:4px}#tools input{min-width:0}
#rows{margin-top:6px;overflow-y:visible;overscroll-behavior:contain}
#rows button{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;border:0;border-bottom:1px solid #dfebe5;background:white;color:#214c43;padding:5px 7px;text-align:left;cursor:pointer;font-size:13px}
#rows.large-list{max-height:300px;overflow-y:auto}
#rows button[aria-current="true"]{background:#dfede7}
#rows button:hover,#rows button:focus-visible{background:#e6f2ed}#rows small{white-space:nowrap;color:#587169}
#pages{display:flex;align-items:center;justify-content:space-between;font-size:12px;margin-top:4px}#pages[hidden]{display:none}
#pages button{border:1px solid #cad9d3;background:white;border-radius:5px;font-size:12px}
#matchCount{margin:5px 0 0;font-size:12px;color:#405b51}
#hint{font-size:11px;color:#526a60;margin:4px 0 0}
</style></head><body>
<article aria-label="Member profile">
<header><p class="kicker">Member profile</p><div class="identity"><div class="avatar" aria-hidden="true"><span id="initials"></span><img id="photo" alt="" hidden referrerpolicy="no-referrer"></div><div><h2 id="name"></h2><div class="id" id="memberId"></div></div></div><p class="place" id="location"></p></header>
<main><div class="stats"><div class="stat"><strong class="value" id="distance"></strong><span class="label">Degrees from David</span></div><div class="stat"><strong class="value" id="count"></strong><span class="label">Direct connections</span></div></div>
<section><h3>About</h3><p class="bio" id="bio"></p></section>
<section><h3>Direct connections</h3><div id="chips"></div></section>
<footer>
<div class="actions">
<span id="connected" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10 4 4 8-8"/></svg>Connected</span>
<button type="button" id="connect" disabled hidden aria-describedby="comingSoon"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="7" cy="6" r="3"/><path d="M1.5 16c.5-5 10.5-5 11 0m3-10v6m-3-3h6"/></svg>Connect</button>
<button type="button" id="message" disabled hidden aria-describedby="comingSoon"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3.5h14v10H8l-5 3z"/></svg>Message</button>
</div>
<p id="comingSoon" hidden>Connection requests and messaging coming soon.</p>
<span>Fictional demo profile</span></footer></main></article>
<section id="browser" aria-labelledby="panelTitle">
<h3 id="panelTitle"></h3>
<div id="tools"><input id="localSearch" type="search" aria-label="Search direct connections" placeholder="Name or ID">
<select id="scope" aria-label="Connection filter"><option>All</option><option>Mutual</option><option>Route Relevant</option><option>Direct</option></select></div>
<p id="matchCount" role="status"></p><p id="hint"></p><div id="rows"></div>
<nav id="pages" aria-label="Connection pages" hidden><button id="prev">Previous</button><span id="range"></span><button id="next">Next</button></nav>
</section>
<script src="connections.js"></script><script src="profile.js"></script></body></html>
